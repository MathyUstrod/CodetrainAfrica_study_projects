<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/73fdb8064c.js" crossorigin="anonymous"></script>
    <title>Tic-Tac-Toe</title>
</head>

<body>

    <div class="flex shrink justify-center min-h-screen min-w-[80vw] items-center my-2 mx-2">
        <main>
            <section class="bg-slate-600 w-auto p-4 rounded-2xl">
                <!-- Scores -->
                <div class="flex justify-center">
                    <h1 class="font-bold text-4xl md:text-6xl text-amber-400 my-4">Tic-Tac-Toe</h1>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 items-center m-4 gap-4">
                    <div class="rounded-full w-auto h-auto bg-amber-300">
                        <p class="text-center px-4 py-2">
                            <span class="text-lg font-bold">Player 1 Score:</span>
                            <span class="text-lg font-bold" id="player-one-score">0</span>
                        </p>
                    </div>
                    <div class="rounded-full w-auto h-auto bg-amber-300">
                        <p class="text-center py-2">
                            <span class="text-lg font-bold">Player 2 Score:</span>
                            <span class="text-lg font-bold" id="player-two-score">0</span>
                        </p>
                    </div>
                </div>
                <!-- Game grid -->
                  <div class="p-4 my-4 grid grid-cols-3 justify-items-center bg-slate-400 rounded-xl w-auto text-3xl md:text-5xl" id="grid">
                    <button class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board"></button>
                    <button class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board"></button>
                    <button class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board"></button>
                    <button class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board"></button>
                    <button class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board"></button>
                    <button class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board"></button>
                    <button class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board"></button>
                    <button class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board"></button>
                    <button class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board"></button>
                </div>
            </section>
            
        </main>
    </div>
    <script type="text/javascript" src="tic-tac-toe.js"></script>
</body>

</html>
