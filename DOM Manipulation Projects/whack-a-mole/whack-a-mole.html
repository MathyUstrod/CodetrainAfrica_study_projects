<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/73fdb8064c.js" crossorigin="anonymous"></script>
    <title>Whack-a-Mole</title>
</head>

<body class="bg-slate-800">
    <div class="flex justify-center min-h-screen items-center my-2 mx-2">
        <main>
            <section class="bg-slate-600 w-auto p-4 rounded-2xl shadow-xl">
                <!-- Header Title -->
                <div class="flex justify-center">
                    <h1 class="font-bold text-4xl md:text-6xl text-amber-400 my-4 animate-pulse">Whack-a-Mole!!</h1>
                </div>

                <!-- Game score and timer -->
                <div class="grid grid-cols-1 md:grid-cols-2 items-center m-4 gap-4">
                    <div class="rounded-full bg-amber-300">
                        <p class="text-center px-4 py-2">
                            <span class="text-lg font-bold">Score:</span>
                            <span class="text-lg font-bold" id="score">0</span>
                        </p>
                    </div>
                    <div class="rounded-full bg-rose-400 text-white">
                        <p class="text-center py-2">
                            <span class="text-lg font-bold">Time Left:</span>
                            <span class="text-lg font-bold" id="time-left">30</span>s
                        </p>
                    </div>
                </div>

                <!-- Grid of mole tiles -->
                <div class="p-4 my-4 grid grid-cols-3 justify-items-center bg-slate-400 rounded-xl w-auto text-3xl md:text-5xl"
                    id="grid">
                    <button
                        class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board flex items-center justify-center"></button>
                    <button
                        class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board flex items-center justify-center"></button>
                    <button
                        class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board flex items-center justify-center"></button>
                    <button
                        class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board flex items-center justify-center"></button>
                    <button
                        class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board flex items-center justify-center"></button>
                    <button
                        class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board flex items-center justify-center"></button>
                    <button
                        class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board flex items-center justify-center"></button>
                    <button
                        class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board flex items-center justify-center"></button>
                    <button
                        class="h-18 md:h-32 w-18 md:w-32 m-4 bg-amber-50 rounded-lg hover:bg-amber-100 board flex items-center justify-center"></button>
                </div>

                <!-- Start game button -->
                <div class="flex justify-center mt-4">
                    <button id="start-btn"
                        class="bg-emerald-500 text-white font-bold px-6 py-2 rounded-xl text-xl hover:bg-emerald-600 transition-all cursor-pointer">Start
                        Game</button>
                </div>
            </section>
        </main>
    </div>
    <script type="text/javascript" src="whack-a-mole.js"></script>
</body>

</html>
