<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/73fdb8064c.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Style+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=home" />
    
    <style>
        .style-script-regular {
            font-family: 'Style Script', cursive;
        }
    </style>
    <title>Instagram</title>
</head>
<body>
    <main>
        <div class="container mx-auto h-[54px] w-[100%]">
            <div class="flex justify-between my-2 border border-gray-200 p-0">
                <div class="mx-8">
                    <h1 class="text-2xl font-bold style-script-regular my-2">Instagram</h1>
                </div>
                <div class="mx-8 my-2">
                    <div class="relative">
                        <input type="text" placeholder="Search" class="border border-gray-300 focus:outline-none  rounded-sm pb-1 h-[30px] bg-gray-100 text-center w-64 pl-8">
                        <span class="absolute left-25 top-1 text-gray-400">
                            <i class="fa-solid fa-magnifying-glass text-[14px]"></i>
                        </span>
                    </div>
                </div>
                <div class="flex items-center my-2 mr-4">
                    <div class="mx-2">
                        <i class="material-symbols-outlined text-2xl pt-1">home</i>
                    </div>
                    
                    <i class="fa-regular fa-paper-plane mx-2"></i>
                    <i class="fa-regular fa-compass mx-2"></i>
                    <i class="fa-regular fa-heart mx-2"></i>
                    <i class="fa-solid fa-user mx-2 border border-gray-200 rounded-full bg-gray-200 text-gray-500 py-1 px-0.5"></i>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
