<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/73fdb8064c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=apps" />
    <title>LinkedIn</title>
</head>
<body>
    <nav>
        <div class="container mx-auto bg-white drop-shadow-lg">
            <div class="flex items-center justify-between h-[52px] border border-gray-300 px-4 my-2">
                <div class="flex items-center relative w-1/4">
                    <a href="#"><i class="fa-brands fa-linkedin text-blue-700 text-3xl"></i></a>
                    <input type="text" placeholder="Search" class="border border-gray-300 rounded-md bg-gray-100 pl-10 py-1 ml-2 w-full">
                    <span class="absolute left-16 top-1 text-gray-400">
                        <i class="fa-solid fa-magnifying-glass text-[14px]"></i>
                    </span>
                </div>

                <div class="flex items-center space-x-6">
                    <a href="#" class="text-black"><i class="fa-solid fa-house"></i></a>
                    <a href="#" class="text-black"><i class="fa-solid fa-user-group text-gray-500"></i></a>
                    <a href="#" class="text-black"><i class="fa-solid fa-briefcase text-gray-500"></i></a>
                    <a href="#" class="text-black"><i class="fa-solid fa-comment-dots text-gray-500"></i></a>
                    <div class="relative">
                        <a href="#" class="text-black"><i class="fa-solid fa-bell text-gray-500"></i></a>
                        <span class="absolute left-3 -top-1.5 bg-red-800 text-white text-xs rounded-full px-1 py-0.5">
                            15
                        </span>
                    </div>
                    <div class="border-r border-gray-300">
                       <div class="bg-gray-200 w-8 h-8 flex items-center justify-center rounded-full mr-4">
                            <a href="#" class="text-gray-500"><i class="fa-solid fa-user"></i></a>
                        </div> 
                    </div>
                    
                    <div class="cursor-pointer flex items-center">
                        <span class="material-symbols-outlined cursor-pointer text-gray-500">
                            apps
                        </span>
                    </div>
                    <div class="cursor-pointer">
                        <i class="fa-regular fa-square-caret-right text-gray-500 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
