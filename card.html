<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/73fdb8064c.js" crossorigin="anonymous"></script>
    <title>Card</title>
</head>
<body>

    <div class="flex flex-col bg-sky-100 w-100 h-140 m-20 rounded-lg shadow-lg ">

        <div class="p-6 bg-sky-300 w-50 h-50 mt-20 mx-25 rounded-full bg-[url('engineer.jpg')] bg-cover bg-center">
            
        </div>

        <div class="bg-sky-100 h-30 m-2">
            <h2 class="text-2xl font-bold text-slate-800 text-center">Mathy Ustrod</h2>
            <p class="text-lg text-slate-700 text-center">Software & AI Engineer</p>
            <p class="text-md text-slate-600 text-center m-2">Harnessing AI and custom software to streamline processes across industrial environments.</p>
           
        </div>

        <div class="flex justify-center space-x-4 my-4">
            <a href="#"><i class="fa-brands fa-square-facebook text-slate-700 hover:text-slate-950"></i></a>
            <a href="#"><i class="fa-brands fa-square-x-twitter text-slate-700 hover:text-slate-950"></i></a>
            <a href="#"><i class="fa-brands fa-linkedin text-slate-700 hover:text-slate-950"></i></a>
            <a href="#"><i class="fa-brands fa-github text-slate-700 hover:text-slate-950"></i></a>
        </div>

        <button class="bg-sky-300 text-slate-800 h-10 w-5/6 px-4 rounded-full mx-auto block hover:bg-sky-400">
            Connect
        </button>

    </div>
    
</body>
</html>
